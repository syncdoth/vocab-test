<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#142820">
  <meta name="description" content="A daily vocabulary test from the VZIP Ascent and Summit word lists.">
  <title>Vocab Daily</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.mjs"></script>
</head>
<body>
  <div class="shell">
    <header class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Vocab Daily</span></div>
      <nav class="navigation" aria-label="Main">
        <button type="button" data-view="today"><span class="nav-icon nav-today" aria-hidden="true"></span>Today</button>
        <button type="button" data-view="schedule"><span class="nav-icon nav-schedule" aria-hidden="true"></span>Schedule</button>
        <button type="button" data-view="history"><span class="nav-icon nav-history" aria-hidden="true"></span>History</button>
      </nav>
      <div class="sidebar-foot">
        <span class="foot-title">VZIP Ascent + Summit</span>
        <span>2,400 words · Korea time</span>
      </div>
    </header>
    <main id="main" class="main" aria-busy="true">
      <p class="loading" role="status">Loading vocabulary…</p>
      <noscript><p>Enable JavaScript to take the vocabulary test.</p></noscript>
    </main>
  </div>
</body>
</html>
