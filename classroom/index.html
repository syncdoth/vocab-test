<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#142820">
  <meta name="description" content="Daily English vocabulary practice for your class.">
  <title>Vocab Daily · Classroom</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/classroom.css">
  <script type="module" src="/classroom.mjs"></script>
</head>
<body>
  <div class="shell">
    <header class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Vocab Daily</span></div>
      <nav class="navigation" aria-label="Main" hidden></nav>
      <div class="sidebar-foot">
        <span class="foot-title">VZIP Ascent + Summit</span>
        <span>2,400 words · Korea time</span>
        <button type="button" class="sign-out" data-command="logout" hidden>Sign out</button>
      </div>
    </header>
    <main id="main" class="main" aria-busy="true">
      <p class="loading" role="status">Opening Vocab Daily…</p>
      <noscript><p>Enable JavaScript to take the vocabulary test.</p></noscript>
    </main>
  </div>

</html>
